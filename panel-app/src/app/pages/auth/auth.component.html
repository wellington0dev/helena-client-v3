<div class="page">
  <div class="card-wrap">
    <div class="brand">
      <div class="brand-mark">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="white" stroke-width="2" />
          <path d="M9 10h.01M15 10h.01M9 14c.8.7 1.9 1 3 1s2.2-.3 3-1" stroke="white" stroke-width="2" stroke-linecap="round" />
        </svg>
      </div>
      <span class="brand-name">Helena</span>
    </div>

    <form class="card" (submit)="$event.preventDefault(); submit()">
      <div class="mode-toggle">
        <button type="button" (click)="setMode('login')" [class.mode-active]="mode() === 'login'">Entrar</button>
        <button type="button" (click)="setMode('register')" [class.mode-active]="mode() === 'register'">Cadastrar</button>
      </div>

      @if (mode() === "register") {
        <label>Nome</label>
        <input [(ngModel)]="name" name="name" placeholder="Como podemos te chamar" />
      }

      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" placeholder="voce@email.com" />

      <label>Senha</label>
      <input type="password" [(ngModel)]="password" name="password" placeholder="mínimo 8 caracteres" />

      @if (error()) {
        <div class="error">{{ error() }}</div>
      }

      <button type="submit" class="submit" [disabled]="busy()">
        {{ busy() ? (mode() === "register" ? "Criando conta…" : "Entrando…") : mode() === "register" ? "Criar conta" : "Entrar" }}
      </button>
    </form>
  </div>
</div>
