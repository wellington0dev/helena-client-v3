<div class="toast-stack">
  @for (item of toast.toasts(); track item.id) {
    <div class="toast" [class.toast-success]="item.kind === 'success'" [class.toast-warn]="item.kind === 'warn'" [class.toast-danger]="item.kind === 'danger'">
      <app-icon [name]="item.kind === 'success' ? 'check' : 'warning'" />
      <span class="toast-message">{{ item.message }}</span>
      <button class="toast-close" (click)="toast.dismiss(item.id)" title="Fechar" aria-label="Fechar aviso">
        <app-icon name="close" />
      </button>
    </div>
  }
</div>
